steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/rag-ingest', '.']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - rag-ingest
      - --image=gcr.io/$PROJECT_ID/rag-ingest
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --set-env-vars=GCS_BUCKET=your-bucket-name,POSTGRES_URL=postgresql+psycopg2://user:password@host:5432/dbname,OPENAI_API_KEY=sk-xxx
images:
  - gcr.io/$PROJECT_ID/rag-ingest
